sampling_rate_hz: 50
window_samples: 128      # 2.56 s at 50 Hz
overlap: 0.5
noise_cutoff_hz: 20
gravity_cutoff_hz: 0.3
activities: [WALKING, WALKING_UPSTAIRS, WALKING_DOWNSTAIRS, SITTING, STANDING, LAYING]
split:
  uci: official          # 21 train subjects, 9 test subjects
  uci_val: [3, 22, 25]   # held out from UCI train by person (seed 42)
  own_train: [p1, p2, p3]
  own_test: [p4, p5]
seed: 42
norm_stats: config/norm_stats.npz   # train-only per-channel mean/std
smooth_window: 5       # majority-vote smoothing window (odd, in windows)
video:                   # camera pipeline (src/video_pose.py)
  fps: 25
  window_frames: 50      # 2 s at 25 fps
  overlap: 0.5
  max_gap: 5             # NaN gaps up to this many frames are interpolated
  pose_model: models/pose_landmarker_full.task   # MediaPipe .task file (gitignored)
  classes: [walking, standing, stairs]   # camera model: no sitting/lying clips, up/down stairs merged
