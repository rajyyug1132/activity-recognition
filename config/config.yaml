sampling_rate_hz: 50
window_samples: 128      # 2.56 s at 50 Hz
overlap: 0.5
noise_cutoff_hz: 20
gravity_cutoff_hz: 0.3
activities: [WALKING, WALKING_UPSTAIRS, WALKING_DOWNSTAIRS, SITTING, STANDING, LAYING]
split:
  uci: official          # 21 train subjects, 9 test subjects
  uci_val: [3, 22, 25]   # held out from UCI train by person (seed 42)
  own_train: [p1, p2, p3]
  own_test: [p4, p5]
seed: 42
norm_stats: config/norm_stats.npz   # train-only per-channel mean/std
